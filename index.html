<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接送系統</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', sans-serif; text-align: center; background: #f4f7f6; margin: 0; padding: 20px; }
    
    /* 首頁選單 */
    .role-btn { display: block; width: 80%; max-width: 300px; margin: 20px auto; padding: 20px; font-size: 24px; border: none; border-radius: 15px; cursor: pointer; color: white; transition: transform 0.2s; }
    .btn-guard { background: #2c3e50; }
    .btn-class { background: #27ae60; }
    .role-btn:active { transform: scale(0.95); }

    /* 隱藏區塊 */
    #menu-page, #guard-page, #class-page { display: none; }
    .active { display: block !important; }

    /* 警衛頁樣式 */
    #reader { width: 100%; max-width: 400px; margin: 0 auto; background: white; }
    #scan-msg { font-size: 20px; margin-top: 15px; font-weight: bold; min-height: 30px;}

    /* 教室頁樣式 */
    .class-select { font-size: 20px; padding: 10px; margin: 20px; }
    .monitor-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-top: 20px;}
    .status-text { font-size: 18px; color: #7f8c8d; }
    
    /* 彈出視窗 (Modal) */
    #popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; flex-direction: column; }
    #popup-content { background: #f1c40f; color: #c0392b; padding: 40px; border-radius: 20px; text-align: center; animation: popin 0.3s; width: 80%; }
    #popup-name { font-size: 60px; font-weight: bold; margin: 20px 0; }
    #popup-btn { font-size: 24px; padding: 10px 30px; background: white; border: none; cursor: pointer; border-radius: 10px; }

    @keyframes popin { from {transform: scale(0);} to {transform: scale(1);} }
  </style>
</head>
<body>

  <div id="menu-page" class="active">
    <h1>校園接送系統</h1>
    <p>請選擇您的身份</p>
    <button class="role-btn btn-guard" onclick="showGuard()">我是警衛 (掃描端)</button>
    <button class="role-btn btn-class" onclick="showClass()">我是班級 (接收端)</button>
  </div>

  <div id="guard-page">
    <h2>👮‍♂️ 掃描模式</h2>
    <div id="reader"></div>
    <div id="scan-msg">請掃描 QR Code</div>
    <button onclick="location.reload()" style="margin-top:20px; padding:10px;">重新整理</button>
  </div>

  <div id="class-page">
    <h2>🏫 班級廣播看板</h2>
    <select id="class-select" class="class-select">
      <option value="">-- 請選擇班級 --</option>
      <option value="1a">1a 班</option>
      <option value="2a">2a 班</option>
      <option value="3a">3a 班</option>
      <option value="4a">4a 班</option>
      <option value="5a">5a 班</option>
      <option value="6a">6a 班</option>
    </select>
    
    <div class="monitor-box">
      <button id="start-btn" onclick="startMonitoring()" style="font-size:18px; padding:10px 20px; background:#3498db; color:white; border:none; border-radius:5px;">🔴 點此開始監聽</button>
      <p id="monitor-status" class="status-text" style="display:none;">監聽中...<br>有家長抵達時會自動彈出通知</p>
    </div>
  </div>

  <div id="popup">
    <div id="popup-content">
      <div>家長已抵達！</div>
      <div id="popup-name">王小明</div>
      <button id="popup-btn" onclick="closePopup()">收到 (關閉)</button>
    </div>
  </div>

  <script>
    // 切換頁面
    function showGuard() {
      document.getElementById('menu-page').classList.remove('active');
      document.getElementById('guard-page').classList.add('active');
      startScanner();
    }
    function showClass() {
      document.getElementById('menu-page').classList.remove('active');
      document.getElementById('class-page').classList.add('active');
    }

    // --- 警衛端邏輯 ---
    function startScanner() {
      var html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
      var isScanning = true;

      html5QrcodeScanner.render(function(decodedText) {
        if(!isScanning) return;
        isScanning = false;
        document.getElementById('scan-msg').innerText = "讀取中...";
        
        google.script.run.withSuccessHandler(function(res){
          if(res.status === 'success') {
             document.getElementById('scan-msg').innerText = "✅ " + res.class_name + " " + res.name + " 已登記";
             document.getElementById('scan-msg').style.color = "green";
          } else {
             document.getElementById('scan-msg').innerText = "❌ " + res.message;
             document.getElementById('scan-msg').style.color = "red";
          }
          setTimeout(() => { isScanning = true; document.getElementById('scan-msg').innerText = "請掃描 QR Code"; document.getElementById('scan-msg').style.color = "black"; }, 3000);
        }).processScan(decodedText);
      });
    }

    // --- 教室端邏輯 ---
    var monitorInterval;
    var lastAlertName = ""; // 避免同一個人一直重複跳

    function startMonitoring() {
      var selectedClass = document.getElementById('class-select').value;
      if (!selectedClass) { alert("請先選擇班級！"); return; }

      document.getElementById('start-btn').style.display = 'none';
      document.getElementById('class-select').disabled = true;
      document.getElementById('monitor-status').style.display = 'block';
      document.getElementById('monitor-status').innerHTML = "📡 正在監聽 <b>" + selectedClass + "</b> 的訊號...";

      // 每 3 秒檢查一次
      monitorInterval = setInterval(function() {
        google.script.run.withSuccessHandler(function(res) {
          if (res.hasNew && res.name !== lastAlertName) {
            lastAlertName = res.name; // 記錄這次名字，避免下次檢查又跳一次
            showPopup(res.name);
          }
        }).checkNewArrivals(selectedClass);
      }, 3000);
    }

    function showPopup(name) {
      document.getElementById('popup-name').innerText = name;
      document.getElementById('popup').style.display = 'flex';
      playDing();
    }

    function closePopup() {
      document.getElementById('popup').style.display = 'none';
    }

    // 播放音效 (使用瀏覽器內建頻率，不需外部檔案)
    function playDing() {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = 800; // 音高
      gain.gain.setValueAtTime(1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.5);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 1.5);
    }
  </script>
</body>
</html>
