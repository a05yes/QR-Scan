<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>警衛掃描站 (GitHub版)</title>
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { font-family: sans-serif; background-color: #222; color: white; text-align: center; padding: 20px; }
    #reader { width: 100%; max-width: 500px; margin: 0 auto; background: white; }
    #msg { margin-top: 20px; font-size: 24px; font-weight: bold; }
  </style>
</head>
<body>
  <h2>👮‍♂️ 掃描站</h2>
  <div id="reader"></div>
  <div id="msg">請掃描 QR Code</div>

  <script>
    // ==========================================
    // ⚠️ 請將下方網址換成您的 Google Script 網址
    var API_URL = "https://script.google.com/macros/s/您的ID/exec"; 
    // ==========================================

    var isScanning = true;

    function onScanSuccess(decodedText) {
      if (!isScanning) return;
      isScanning = false;
      document.getElementById('msg').innerText = "⏳ 傳送中...";

      // 使用 fetch 發送 POST 請求到 Google Script
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "scan", studentId: decodedText }),
        // 這裡用 text/plain 是為了避開 CORS 檢查，這很關鍵
        headers: { "Content-Type": "text/plain" } 
      })
      .then(response => response.json())
      .then(data => {
        if (data.status === 'success') {
          document.getElementById('msg').innerHTML = `<span style="color:#2ecc71">✅ ${data.class_name}<br>${data.name}</span>`;
        } else {
          document.getElementById('msg').innerHTML = `<span style="color:red">❌ ${data.message}</span>`;
        }
        setTimeout(() => { isScanning = true; document.getElementById('msg').innerText = "請掃描 QR Code"; }, 3000);
      })
      .catch(err => {
        console.error(err);
        document.getElementById('msg').innerText = "❌ 網路錯誤";
        setTimeout(() => { isScanning = true; }, 3000);
      });
    }

    var html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
  </script>
</body>
</html>
