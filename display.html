<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接送等待看板</title>
  <style>
    body { font-family: 'Microsoft JhengHei', sans-serif; background: #222; color: white; padding: 20px; margin: 0; }
    
    h1 { text-align: center; color: #f1c40f; margin-bottom: 30px; font-size: 36px; border-bottom: 2px solid #555; padding-bottom: 10px;}

    /* 卡片容器 (Grid 排版) */
    #card-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 單張卡片樣式 */
    .card {
      background: #333;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: all 0.3s;
      border-left: 10px solid #95a5a6; /* 預設灰色 */
      position: relative;
      animation: fadeIn 0.5s;
    }

    .class-name { font-size: 24px; color: #aaa; margin-bottom: 5px; }
    .stu-name { font-size: 50px; font-weight: bold; margin: 10px 0; color: white; letter-spacing: 2px; }
    .status { font-size: 32px; font-weight: bold; padding: 10px; border-radius: 10px; display: inline-block; width: 80%; margin-top: 10px;}

    /* 不同狀態的顏色 */
    .status-waiting { background: #e67e22; color: white; } /* 等待中 */
    .status-pack { background: #f1c40f; color: black; }   /* 收書包 */
    .status-wc { background: #3498db; color: white; }      /* 上廁所 */
    .status-club { background: #9b59b6; color: white; }    /* 社團 */
    .status-ok { background: #2ecc71; color: white; }      /* 收到 */

    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <h1>📢 目前等待回應名單 (隱私保護中)</h1>
  <div id="card-container">
    <div style="text-align: center; grid-column: 1/-1; color: #555; font-size: 24px; margin-top: 50px;">
      目前無等待中的學生...
    </div>
  </div>

  <script>
    // ============================================
    // ✅ 您的 Firebase 網址
    var firebaseConfig = { databaseURL: "https://schoolpickup-7afca-default-rtdb.asia-southeast1.firebasedatabase.app/" };
    // ============================================
    firebase.initializeApp(firebaseConfig);
    var database = firebase.database();

    // 監聽最近 6 筆資料
    var ref = database.ref('pickups').limitToLast(6);
    var cardsData = {};

    // 資料新增或變更時觸發
    ref.on('child_added', (snapshot) => { updateCard(snapshot.val()); });
    ref.on('child_changed', (snapshot) => { updateCard(snapshot.val()); });

    function updateCard(data) {
      var now = new Date().getTime();
      // 如果資料超過 10 分鐘，就不顯示了
      if (now - data.timestamp > 600000) return;
      cardsData[data.id] = data;
      renderAllCards();
    }

    function renderAllCards() {
      var container = document.getElementById('card-container');
      container.innerHTML = ""; 

      // 將物件轉為陣列並反轉 (新的在前面)
      var list = Object.values(cardsData).sort((a, b) => b.timestamp - a.timestamp);

      if (list.length === 0) {
        container.innerHTML = '<div style="text-align: center; grid-column: 1/-1; color: #555; font-size: 24px; margin-top: 50px;">目前無等待中的學生...</div>';
        return;
      }

      list.forEach(item => {
        // 設定狀態顏色
        var statusClass = "status-waiting";
        var borderColors = "#95a5a6";
        if (item.status.includes("收書包")) { statusClass = "status-pack"; borderColors = "#f1c40f"; }
        else if (item.status.includes("上廁所")) { statusClass = "status-wc"; borderColors = "#3498db"; }
        else if (item.status.includes("社團")) { statusClass = "status-club"; borderColors = "#9b59b6"; }
        else if (item.status.includes("收到")) { statusClass = "status-ok"; borderColors = "#2ecc71"; }

        // --- 🆕 新增：姓名遮蔽邏輯 ---
        var fullName = item.name;
        var maskedName = fullName; // 預設為原名

        if (fullName.length >= 3) {
          // 如果是 3 個字以上 (例如：王小明 → 王O明, 歐陽非凡 → 歐OO凡)
          // 保留頭尾，中間全部變 O
          maskedName = fullName[0] + "O".repeat(fullName.length - 2) + fullName[fullName.length - 1];
        } else if (fullName.length === 2) {
          // 如果是 2 個字 (例如：李大 → 李O)
          // 保留第一個字，後面變 O
          maskedName = fullName[0] + "O";
        }
        // ---------------------------

        var html = `
          <div class="card" style="border-left-color: ${borderColors}">
            <div class="class-name">${item.class_name} 班</div>
            <div class="stu-name">${maskedName}</div>
            <div class="status ${statusClass}">${item.status}</div>
            <div style="color: #666; margin-top: 10px; font-size: 14px;">
              ${new Date(item.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
            </div>
          </div>
        `;
        container.innerHTML += html;
      });
    }

    // 每分鐘自動清理一次舊卡片
    setInterval(() => {
      var now = new Date().getTime();
      for (var key in cardsData) {
        if (now - cardsData[key].timestamp > 600000) { 
          delete cardsData[key];
        }
      }
      renderAllCards();
    }, 60000);

  </script>
</body>
</html>
