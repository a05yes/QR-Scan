<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>接送等待看板</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background: #222;
            color: white;
            padding: 20px;
            margin: 0;
        }

        /* 標題區與連線狀態 */
        header {
            position: relative;
            border-bottom: 2px solid #555;
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #f1c40f;
            font-size: 36px;
            margin: 0;
        }

        /* 連線狀態燈 */
        #connection-status {
            position: absolute;
            left: 10px;
            top: 10px;
            font-size: 14px;
            color: #aaa;
        }

        .dot {
            height: 12px;
            width: 12px;
            background-color: #e74c3c;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .connected {
            background-color: #2ecc71;
            box-shadow: 0 0 10px #2ecc71;
        }

        /* 卡片容器 (Grid 排版) */
        #card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 單張卡片樣式 */
        .card {
            background: #333;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.3s;
            border-left: 12px solid #95a5a6;
            position: relative;
            animation: fadeIn 0.5s;
        }

        .class-name {
            font-size: 28px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .stu-name {
            font-size: 56px;
            font-weight: bold;
            margin: 10px 0;
            color: white;
            letter-spacing: 2px;
        }

        .status {
            font-size: 36px;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            width: 90%;
            margin-top: 10px;
        }

        .time-stamp {
            color: #777;
            margin-top: 15px;
            font-size: 16px;
        }

        /* 不同狀態的顏色 */
        .status-waiting {
            background: #e67e22;
            color: white;
        }

        /* 等待中 (橘) */
        .status-pack {
            background: #f1c40f;
            color: black;
        }

        /* 收書包 (黃) */
        .status-wc {
            background: #3498db;
            color: white;
        }

        /* 上廁所 (藍) */
        .status-club {
            background: #9b59b6;
            color: white;
        }

        /* 社團 (紫) */
        .status-ok {
            background: #2ecc71;
            color: white;
        }

        /* 收到 (綠) */

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body>

    <header>
        <div id="connection-status"><span id="dot" class="dot"></span><span id="status-text">連線中...</span></div>
        <h1>📢 家長接送等待看板</h1>
    </header>

    <div id="card-container">
        <div style="text-align: center; grid-column: 1/-1; color: #5
