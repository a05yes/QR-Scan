<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級廣播 (除錯模式)</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background: #f0f2f5;
            color: #333;
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        /* 狀態列 */
        #status-bar {
            text-align: left;
            padding: 10px;
            background: #ddd;
            margin-bottom: 20px;
            border-radius: 5px;
            font-size: 14px;
        }

        .dot {
            height: 10px;
            width: 10px;
            background-color: red;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }

        .green {
            background-color: #2ecc71;
            box-shadow: 0 0 5px #2ecc71;
        }

        /* 除錯日誌區 (關鍵) */
        #debug-log {
            width: 90%;
            margin: 20px auto;
            height: 150px;
            background: #000;
            color: #0f0;
            font-family: monospace;
            text-align: left;
            padding: 10px;
            overflow-y: scroll;
            border: 2px solid #555;
            border-radius: 5px;
            font-size: 12px;
        }

        /* 選單 */
        #select-view {
            max-width: 900px;
            margin: 20px auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            70% {
                transform: scale(1.1);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .new-arrival {
            animation: popIn 0.8s ease-out;
            border: 4px solid #f1c40f !important;
            /* 強調邊框 */
            box-shadow: 0 0 20px #f1c40f;
        }

        .btn {
            padding: 40px 0;
            font-size: 36px;
            background: white;
            border-radius: 15px;
            cursor: pointer;
            border: 2px solid #ddd;
        }

        .btn:hover {
            background: #3498db;
            color: white;
        }

        /* 監聽中畫面 */
        #monitor-view {
            display: none;
            margin-top: 50px;
        }

        .monitor-card {
            background: white;
            padding: 50px;
            border-radius: 20px;
            display: inline-block;
            border-bottom: 5px solid #2ecc71;
        }

        /* 彈窗 */
        #popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            /* 半透明背景 */
            backdrop-filter: blur(5px);
        }

        .popup-content {
            background: #2c3e50;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 2px solid #f1c40f;
            max-width: 90%;
            width: 700px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .student-row {
            background: rgba(255, 255, 255, 0.1);
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-left: 5px solid #f1c40f;
        }

        .student-name {
            font-size: 40px;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
        }

        .action-btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            padding: 8px 16px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            margin: 2px;
        }

        .btn-pack {
            background: #f39c12;
        }

        .btn-wc {
            background: #3498db;
        }

        .btn-club {
            background: #9b59b6;
        }

        .btn-ok {
            background: #2ecc71;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body>

    <div id="status-bar">
        <span id="dot" class="dot"></span> <span id="status-text">連接中...</span>
    </div>

    <div id="debug-log">系統日誌 (Log):<br></div>

    <div id="select-view">
        <h2>請選擇班級 (除錯版)</h2>
        <div class="grid">
            <div class="btn" onclick="startMonitor('1a')">1a</div>
            <div class="btn" onclick="startMonitor('2a')">2a</div>
            <div class="btn" onclick="startMonitor('3a')">3a</div>
            <div class="btn" onclick="startMonitor('4a')">4a</div>
            <div class="btn" onclick="startMonitor('5a')">5a</div>
            <div class="btn" onclick="startMonitor('6a')">6a</div>
        </div>
    </div>

    <div id="monitor-view">
        <div class="monitor-card">
            <h2 id="class-title" style="font-size: 40px;"></h2>
            <p>正在等待訊號...</p>
            <button onclick="location.reload()" style="padding:10px;">重選班級</button>
        </div>
    </div>

    <div id="popup">
        <div class="popup-content">
            <div style="font-size: 24px; color: #f1c40f; margin-bottom: 20px;">🔔 家長已抵達 (請點選回覆)</div>
            <div id="student-list">
                <!-- 動態插入學生列表 -->
            </div>
            <div style="margin-top: 20px;">
                <button onclick="closePopup()"
                    style="background:transparent; border:1px solid #555; color:#777; padding:5px 10px; border-radius:5px; cursor:pointer;">暫時關閉</button>
            </div>
        </div>
    </div>

    <script>
        // ✅ 您的 Firebase 設定
        var firebaseConfig = { databaseURL: "https://schoolpickup-7afca-default-rtdb.asia-southeast1.firebasedatabase.app/" };

        try {
            firebase.initializeApp(firebaseConfig);
        } catch (e) { log("Firebase 初始化失敗: " + e); }

        var database = firebase.database();
        var myClass = "";
        var activeStudents = []; // 改為陣列，儲存多位學生
        var audioCtx;
        var cardsData = {}; // 用於儲存卡片資料，以便判斷是否為新資料

        // 1. 檢查連線狀態
        database.ref(".info/connected").on("value", function (snap) {
            if (snap.val() === true) {
                document.getElementById("dot").classList.add("green");
                document.getElementById("status-text").innerText = "Firebase 已連線";
                log("✅ 網路連線成功！");
            } else {
                document.getElementById("dot").classList.remove("green");
                document.getElementById("status-text").innerText = "連線中斷...";
                log("❌ 網路中斷");
            }
        });

        function log(msg) {
            var box = document.getElementById('debug-log');
            var time = new Date().toLocaleTimeString();
            box.innerHTML += `[${time}] ${msg}<br>`;
            box.scrollTop = box.scrollHeight; // 自動捲動到底部
            console.log(msg);
        }

        function startMonitor(cls) {
            myClass = cls;
            document.getElementById('select-view').style.display = 'none';
            document.getElementById('monitor-view').style.display = 'block';
            document.getElementById('class-title').innerText = "監聽中: " + cls + " 班";

            // 初始化音效
            initAudio();
            log("開始監聽班級: " + cls);

            // 2. 監聽資料 (放寬限制，抓最近 5 筆)
            var ref = database.ref('pickups').limitToLast(5);

            ref.on('child_added', (snapshot) => {
                var data = snapshot.val();
                log("📥 收到資料: " + data.class_name + "班 - " + data.name);
                checkAndAlert(data);
            });
        }


        function checkAndAlert(data) {
            var now = new Date().getTime();

            // A. 檢查時間 (放寬到 5 分鐘內都算有效)
            if (now - data.timestamp > 300000) {
                log("⚠️ 忽略舊資料 (超過5分鐘)");
                return;
            }

            // B. 檢查班級 (轉小寫去空白比較)
            var targetClass = myClass.toLowerCase().trim();
            var incomingClass = data.class_name.toString().toLowerCase().trim();

            if (targetClass === incomingClass) {
                log("🟢 班級符合！加入列表！");

                // 檢查是否已在列表中
                var exists = activeStudents.find(s => s.id === data.id);
                if (!exists) {
                    activeStudents.push(data);
                    // 最多保留 5 人
                    if (activeStudents.length > 5) activeStudents.shift();
                    renderPopup();
                    playDing();
                }
            } else {
                log("⚪ 班級不符 (目標:" + targetClass + " / 收到:" + incomingClass + ")");
            }
        }

        function renderPopup() {
            var listDiv = document.getElementById('student-list');
            listDiv.innerHTML = "";

            activeStudents.forEach(student => {
                var html = `
                    <div class="student-row">
                        <div class="student-name">${student.name}</div>
                        <div class="action-btn-group">
                            <button class="action-btn btn-pack" onclick="replyStatus('${student.id}', '正在收書包')">🎒 收書包</button>
                            <button class="action-btn btn-wc" onclick="replyStatus('${student.id}', '上廁所')">🚻 上廁所</button>
                            <button class="action-btn btn-club" onclick="replyStatus('${student.id}', '去上社團')">⚽ 去社團</button>
                            <button class="action-btn btn-ok" onclick="replyStatus('${student.id}', '收到')">👌 收到</button>
                        </div>
                    </div>
                `;
                listDiv.innerHTML += html;
            });

            var popup = document.getElementById('popup');
            popup.style.display = 'flex';

            // 簡單的閃爍動畫
            var content = popup.querySelector('.popup-content');
            content.classList.remove('new-arrival');
            void content.offsetWidth;
            content.classList.add('new-arrival');
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }

        function replyStatus(id, statusText) {
            log("📤 回傳狀態: " + statusText + " (ID: " + id + ")");

            database.ref('pickups/' + id).update({
                status: statusText
            }).then(() => {
                log("✅ 狀態更新成功");
                // 移除該學生
                activeStudents = activeStudents.filter(s => s.id !== id);
                if (activeStudents.length > 0) {
                    renderPopup(); // 還有學生，重繪
                } else {
                    closePopup(); // 沒學生了，關閉
                }
            }).catch((err) => {
                log("❌ 更新失敗: " + err);
            });
        }

        // 音效設定
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            var osc = audioCtx.createOscillator(); osc.connect(audioCtx.destination);
            osc.start(0); osc.stop(0.01);
        }

        function playDing() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            var osc = audioCtx.createOscillator();
            var gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(660, audioCtx.currentTime);
            gain.gain.setValueAtTime(1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 1.5);
        }
    </script>
</body>

</html>
