<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <title>班級看板</title>
  <style>
    body { font-family: 'Microsoft JhengHei', sans-serif; background-color: #f4f6f7; text-align: center; padding: 20px; margin: 0; }
    
    /* 1. 選擇班級畫面 */
    #select-view { display: block; max-width: 800px; margin: 0 auto; }
    h1 { color: #2c3e50; margin-bottom: 30px; }
    
    .grid-box {
      display: grid;
      grid-template-columns: repeat(3, 1fr); /* 三欄 */
      gap: 20px; 
    }
    
    .class-btn {
      background: white;
      border: 2px solid #3498db;
      border-radius: 15px;
      padding: 40px 0;
      font-size: 36px;
      font-weight: bold;
      color: #2c3e50;
      cursor: pointer;
      box-shadow: 0 5px 0 #2980b9;
      transition: all 0.1s;
    }
    .class-btn:active { box-shadow: 0 2px 0 #2980b9; transform: translateY(3px); }

    /* 2. 監聽畫面 (原本隱藏) */
    #monitor-view { display: none; margin-top: 50px; }
    .monitor-card {
      background: white; padding: 50px; border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1); display: inline-block;
    }
    .dot { display: inline-block; width: 15px; height: 15px; background: #2ecc71; border-radius: 50%; margin-right: 10px; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* 3. 彈出視窗 (全螢幕) */
    #popup {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); z-index: 9999;
      justify-content: center; align-items: center; flex-direction: column;
    }
    #popup-content {
      background: #f1c40f; color: #c0392b; width: 80%; max-width: 600px;
      padding: 40px; border-radius: 30px; text-align: center; border: 10px solid white;
      animation: pop 0.3s ease-out;
    }
    @keyframes pop { from {transform: scale(0);} to {transform: scale(1);} }
    
    .big-name { font-size: 80px; font-weight: bold; margin: 20px 0; }
    .close-btn { font-size: 30px; padding: 15px 60px; background: white; border: none; border-radius: 50px; cursor: pointer; color: #333; font-weight: bold; }
  </style>
</head>
<body>

  <div id="select-view">
    <h1>🏫 請點選您的班級</h1>
    <div class="grid-box">
      <button class="class-btn" onclick="start('1a')">1a</button>
      <button class="class-btn" onclick="start('2a')">2a</button>
      <button class="class-btn" onclick="start('3a')">3a</button>
      <button class="class-btn" onclick="start('4a')">4a</button>
      <button class="class-btn" onclick="start('5a')">5a</button>
      <button class="class-btn" onclick="start('6a')">6a</button>
    </div>
  </div>

  <div id="monitor-view">
    <div class="monitor-card">
      <h2 id="monitor-title" style="font-size: 40px; color: #3498db; margin: 0;"></h2>
      <p style="color: #7f8c8d; font-size: 20px; margin-top: 20px;">
        <span class="dot"></span>系統連線中...
      </p>
      <button onclick="location.reload()" style="margin-top:30px; padding:10px; color:#999; border:none; background:none; cursor:pointer; text-decoration:underline;">重新選擇班級</button>
    </div>
  </div>

  <div id="popup">
    <div id="popup-content">
      <div style="font-size: 30px;">🔔 家長已抵達</div>
      <div id="student-name" class="big-name">王小明</div>
      <button class="close-btn" onclick="closePopup()">收到</button>
    </div>
  </div>

  <script>
    var myClass = "";
    var lastAlertName = "";
    var audioCtx;

    function start(className) {
      myClass = className;
      
      // 1. 切換介面
      document.getElementById('select-view').style.display = 'none';
      document.getElementById('monitor-view').style.display = 'block';
      document.getElementById('monitor-title').innerText = myClass + " 班";

      // 2. 初始化音效 (利用按鈕點擊事件解鎖瀏覽器音效限制)
      initAudio();

      // 3. 開始每 3 秒檢查一次
      setInterval(checkLoop, 3000);
    }

    function checkLoop() {
      google.script.run.withSuccessHandler(function(res) {
        // 如果有新資料，而且名字跟上次不一樣 (避免一直響)
        if (res.hasNew && res.name !== lastAlertName) {
          lastAlertName = res.name;
          showPopup(res.name);
        }
      }).checkNewArrivals(myClass);
    }

    function showPopup(name) {
      document.getElementById('student-name').innerText = name;
      document.getElementById('popup').style.display = 'flex';
      playDing();
    }

    function closePopup() {
      document.getElementById('popup').style.display = 'none';
    }

    // --- 音效處理 ---
    function initAudio() {
      var AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      // 播放一個極短無聲，確保解鎖
      var osc = audioCtx.createOscillator();
      osc.connect(audioCtx.destination);
      osc.start(0);
      osc.stop(0.01);
    }

    function playDing() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      // 叮咚聲設計
      osc.type = 'sine';
      osc.frequency.setValueAtTime(660, audioCtx.currentTime); // 叮
      osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.1); // 咚
      
      gain.gain.setValueAtTime(1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 1.5);
    }
  </script>

</body>
</html>
