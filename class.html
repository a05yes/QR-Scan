<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>班級廣播 (測試除錯版)</title>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }

        #debug-msg {
            color: red;
            font-weight: bold;
            margin: 20px;
            border: 1px solid red;
            padding: 10px;
        }

        .btn {
            padding: 20px;
            margin: 5px;
            font-size: 20px;
            cursor: pointer;
        }

        #popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

<body>

    <h1>🔧 班級廣播 (測試版)</h1>

    <div id="debug-msg">等待操作...</div>

    <div id="select-view">
        <h3>請點選班級：</h3>
        <button class="btn" onclick="startMonitor('1a')">1a</button>
        <button class="btn" onclick="startMonitor('2a')">2a</button>
        <button class="btn" onclick="startMonitor('3a')">3a</button>
        <button class="btn" onclick="startMonitor('4a')">4a</button>
        <button class="btn" onclick="startMonitor('5a')">5a</button>
        <button class="btn" onclick="startMonitor('6a')">6a</button>
    </div>

    <div id="monitor-view" style="display:none;">
        <h2 id="class-title"></h2>
        <p>正在監聽 Firebase 的 "pickups" 節點...</p>
        <p>請現在去掃描新的 QR Code</p>
    </div>

    <div id="popup">
        <h1>🔔 家長已抵達</h1>
        <h1 id="popup-name" style="font-size:80px; color:yellow;"></h1>
        <button class="btn" onclick="closePopup()">收到</button>
    </div>

    <script>
        // ✅ 您的 Firebase 設定
        var firebaseConfig = { databaseURL: "https://schoolpickup-7afca-default-rtdb.asia-southeast1.firebasedatabase.app/" };
        firebase.initializeApp(firebaseConfig);
        var database = firebase.database();

        var myClass = "";

        function log(msg) {
            console.log(msg);
            document.getElementById('debug-msg').innerText = "系統狀態: " + msg;
        }

        function startMonitor(cls) {
            myClass = cls;
            document.getElementById('select-view').style.display = 'none';
            document.getElementById('monitor-view').style.display = 'block';
            document.getElementById('class-title').innerText = "正在監聽: " + cls + " 班";

            log("開始連線 Firebase...");

            // 監聽 pickups 節點
            var ref = database.ref('pickups');

            // 這裡用 limitToLast(1) 抓最新一筆
            ref.limitToLast(1).on('child_added', (snapshot) => {
                var data = snapshot.val();
                log("收到資料！" + JSON.stringify(data));

                // ❌ 移除了時間檢查 (now - timestamp)
                // ❌ 移除了避免重複檢查

                // 只檢查班級
                if (data.class_name.toLowerCase() === myClass.toLowerCase()) {
                    log("班級符合！跳出視窗");
                    showPopup(data.name);
                } else {
                    log("班級不符合 (收到:" + data.class_name + ", 我是:" + myClass + ")");
                }
            });
        }

        function showPopup(name) {
            document.getElementById('popup-name').innerText = name;
            document.getElementById('popup').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('popup').style.display = 'none';
        }
    </script>
</body>

</html>
